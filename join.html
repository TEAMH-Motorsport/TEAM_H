<footer id="ftr"></footer>
<script>
var T=TH,$=function(i){return document.getElementById(i)};
$('jb').innerHTML=T.jobs.map(function(j){return '<div class="card rv"><h3 style="font-size:26px">'+j[0]+'</h3><p>'+j[1]+'</p></div>'}).join('');
$('rl').innerHTML=T.jobs.map(function(j){return '<option>'+j[0]+'</option>'}).join('');
formSave('af','th_apply','지원이 접수됐습니다. 가상 사이트라 실제로는 전송되지 않고 이 브라우저에만 저장됩니다.');
