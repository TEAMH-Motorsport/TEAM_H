<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fan Zone — TEAM_H</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/style.css?v=6">
<script src="js/data.js?v=6"></script><script src="js/overrides.js?v=6"></script><script src="js/apply.js?v=6"></script><script src="js/records.js?v=6"></script><script src="js/common.js?v=6"></script>
</head><body>
<header id="hdr"></header>
<main>
<div class="pg"><div class="wrap"><h1>Fan Zone</h1><p>응원 메시지를 남기고, 배경화면을 받고, 경기를 예측해 보세요.</p></div></div>
<section id="guestbook"><div class="wrap"><div class="sh"><h2>Fan Wall</h2></div><div class="grid g2"><div class="card rv"><h3>응원 메시지</h3><form class="fm" id="gf2"><label>이름</label><input name="n" required maxlength="12"><label>메시지</label><input name="m" required maxlength="80"><button class="btn">남기기</button></form></div><div class="card rv" id="gl2"></div></div>
<p style="margin-top:20px;color:var(--mute)">SNS: <a href="#" style="color:var(--lb)">Instagram</a>, <a href="#" style="color:var(--lb)">YouTube</a> (링크는 나중에 연결)</p></div></section>
<section id="wallpapers"><div class="wrap"><div class="sh"><h2>Wallpapers</h2></div><div class="grid g3" id="wl"></div></div></section>
<section id="cards"><div class="wrap"><div class="sh"><h2>Driver Cards</h2></div><div class="grid g4" id="dc"></div></div></section>
<section id="play"><div class="wrap"><div class="sh"><h2>Predictions &amp; Quiz</h2></div><div class="grid g2"><div class="card rv" id="pr"></div><div class="card rv" id="qz"></div></div></div></section>
<section id="store"><div class="wrap"><div class="card rv"><h3>Team Store</h3><p>팀 굿즈를 만나 보세요.</p><p style="margin-top:16px"><a class="btn" href="store.html">Team Store 가기</a></p></div></div></section>
</main>
<footer id="ftr"></footer>
<script>
var T=TH,$=function(i){return document.getElementById(i)};
var K='th_g',ls=function(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
function gl(){var a=ls(K,[]).concat(T.guest.map(function(x){return{n:x[0],m:x[1]}}).reverse());$('gl2').innerHTML='<h3>메시지</h3>'+a.slice(0,8).map(function(x){return '<p style="border-top:1px solid var(--line);padding:10px 0"><b>'+x.n.replace(/</g,'&lt;')+'</b> '+x.m.replace(/</g,'&lt;')+'</p>'}).join('')}
gl();$('gf2').onsubmit=function(e){e.preventDefault();var a=ls(K,[]);a.unshift({n:this.n.value,m:this.m.value});try{localStorage.setItem(K,JSON.stringify(a.slice(0,30)))}catch(x){}this.reset();gl()};
$('wl').innerHTML=T.walls.map(function(w,i){var f='fan/wall-'+(i+1)+'.jpg';return '<div class="rv">'+ph(f,'','16/10')+'<p style="margin:8px 0">'+w+'</p><a class="btn sub" href="images/'+f+'" download>내려받기</a></div>'}).join('');
$('dc').innerHTML=T.drivers.map(function(d){return '<div class="drv rv" style="--c:'+d.c+';--t:'+d.t+'">'+ph('drivers/'+d.f+'.jpg')+'<em>'+d.no+'</em><h3>'+d.n+'</h3><p><strong>'+d.w+'승</strong>, 포디움 '+d.p+'회</p><p>'+T.driverBirth+'년생</p></div>'}).join('');
var PK='th_pick',pk=ls(PK,{});
function pr(){var o=['#73','#78','다른 팀'];$('pr').innerHTML='<h3>Round '+T.next.round+' 우승 예측</h3><p>'+T.next.circuit+', '+T.next.date.slice(0,10)+'</p><div class="opt">'+o.map(function(x){return '<button'+(pk[T.next.round]==x?' class="sel"':'')+'>'+x+'</button>'}).join('')+'</div><p>'+(pk[T.next.round]?'내 예측: '+pk[T.next.round]:'우승할 차량을 골라 보세요.')+'</p>'}
pr();$('pr').onclick=function(e){var b=e.target.closest('button');if(!b)return;pk[T.next.round]=b.textContent;try{localStorage.setItem(PK,JSON.stringify(pk))}catch(x){}pr()};
var sc=0,qi=0;function qq(){var q=T.quiz[qi];if(!q){$('qz').innerHTML='<h3>Quiz</h3><p>'+T.quiz.length+'문제 중 '+sc+'문제 정답!</p><div class="opt"><button id="rq">다시 풀기</button></div>';$('rq').onclick=function(){sc=0;qi=0;qq()};return}
 $('qz').innerHTML='<h3>Quiz '+(qi+1)+' / '+T.quiz.length+'</h3><p>'+q[0]+'</p><div class="opt">'+q[1].map(function(x,i){return '<button data-i="'+i+'">'+x+'</button>'}).join('')+'</div>'}
qq();$('qz').onclick=function(e){var b=e.target.closest('button[data-i]');if(!b)return;if(+b.dataset.i==T.quiz[qi][2])sc++;qi++;qq()};
</script></body></html>
