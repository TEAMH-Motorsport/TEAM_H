<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Racing — TEAM_H</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/style.css">
<script src="js/data.js"></script><script src="js/records.js"></script><script src="js/common.js"></script>
</head><body>
<header id="hdr"></header>
<main>
<div class="pg"><div class="wrap"><h1>Racing</h1><p>ARC Hypercar와 GT3, 2026 시즌의 차량, 일정, 순위.</p></div></div>
<section id="cars"><div class="wrap"><div class="sh"><h2>Cars</h2></div><div class="grid g3" id="carl"></div></div></section>
<section id="calendar"><div class="wrap"><div class="sh"><h2>Calendar</h2></div><div id="cal"></div></div></section>
<section id="standings"><div class="wrap"><div class="sh"><h2>Standings</h2></div><div class="grid g3" id="stl"></div></div></section>
</main>
<footer id="ftr"></footer>
<script>
var T=TH,$=function(i){return document.getElementById(i)},n=T.n499;
var cars=[{n:'Ferrari 499P',c:'ARC Hypercar',no:'#73 / #78',f:'499p',r:[['엔진','Tenpest 3.5L V10 NA, 700hp'],['출전',n.r+'경기 (2024년부터)'],['우승',n.w],['포디움',n.p]]},
 {n:'Mercedes-AMG GT3 EVO',c:'ARC GT3',no:'#75 / #76',f:'gt3-evo',r:[['엔진','6.2L V8 (M159), 550hp'],['타이틀','컨스트럭터 2회 (2024–2025)'],['드라이버','TBA']]},
 {n:'Mercedes-AMG GT3 EVO',c:'IGTC GT3',no:'TBA',f:'gt3-igtc',r:[['차량번호','TBA'],['드라이버','TBA'],['IGTC 성적','우승 3, 포디움 8']]}];
$('carl').innerHTML=cars.map(function(x){return '<div class="card rv">'+ph('cars/'+x.f+'.jpg')+'<div class="no">'+x.no+'</div><h3>'+x.n+'</h3><p>'+x.c+'</p><dl>'+x.r.map(function(r){return '<dt>'+r[0]+'</dt><dd'+(r[1]=='TBA'?' class="tba"':'')+'>'+r[1]+'</dd>'}).join('')+'</dl></div>'}).join('');
var rows=T.res26.map(function(r){var w=r[3]==1?'#73 TEAM_H':r[4]==1?'#78 TEAM_H':'다른 팀';return ['R'+r[0],r[1],r[2],'P'+r[3],'P'+r[4],w]}).concat(T.future.map(function(r){return ['R'+r[0],r[1],r[2],'-','-','-']}));
$('cal').innerHTML=tbl(['라운드','서킷','날짜','#73','#78','우승'],rows);
var F=T.full,rk=function(a,tm){return a.map(function(r,i){return [i+1,r[0],r[1],i?'-'+(a[0][1]-r[1]):'-']})};
$('stl').innerHTML=tbl(['순위','팀','포인트','차이'],rk(F.hyper),'Hypercar 컨스트럭터')+tbl(['순위','차량','포인트','차이'],rk(F.cars),'Hypercar 차량')+tbl(['순위','팀','포인트','차이'],rk(F.gt3),'GT3 컨스트럭터');
</script></body></html>
